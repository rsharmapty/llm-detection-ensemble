<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Text Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .result-card {
            transition: all 0.3s ease-in-out;
        }
        #loader {
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto px-4 py-8 md:py-16 max-w-4xl">
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900">LLM Generated Text Detector</h1>
            <p class="mt-4 text-lg text-gray-600">Analyze text to determine if it was written by a human or generated by an AI.</p>
        </header>

        <main class="bg-white p-6 md:p-8 rounded-xl shadow-lg">
            <div class="mb-6">
                <label for="text-input" class="block text-lg font-medium text-gray-700 mb-2">Enter Text to Analyze</label>
                <textarea id="text-input" rows="10" class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow" placeholder="Paste your text here..."></textarea>
            </div>

            <div class="text-center">
                <button id="detect-btn" class="bg-blue-600 text-white font-semibold py-3 px-8 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all transform hover:scale-105">
                    Analyze Text
                </button>
            </div>
        </main>

        <section id="results-section" class="mt-12 hidden">
            <h2 class="text-3xl font-bold text-center mb-8">Analysis Results</h2>
            <div id="loader" class="w-12 h-12 rounded-full border-4 border-gray-200 mx-auto hidden"></div>
            <div id="results-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Result cards will be inserted here by JavaScript -->
            </div>
        </section>

    </div>

    <script>
        const detectBtn = document.getElementById('detect-btn');
        const textInput = document.getElementById('text-input');
        const resultsSection = document.getElementById('results-section');
        const resultsGrid = document.getElementById('results-grid');
        const loader = document.getElementById('loader');

        const createResultCard = (modelName, prediction, confidence) => {
            const isAI = prediction === 'AI';
            const bgColor = isAI ? 'bg-red-50' : 'bg-green-50';
            const textColor = isAI ? 'text-red-800' : 'text-green-800';
            const borderColor = isAI ? 'border-red-200' : 'border-green-200';
            const confidenceBg = isAI ? 'bg-red-200' : 'bg-green-200';
            
            return `
                <div class="result-card ${bgColor} p-6 rounded-xl border ${borderColor} shadow-md transform hover:-translate-y-1">
                    <h3 class="text-xl font-semibold text-gray-900">${modelName}</h3>
                    <div class="mt-4 text-center">
                        <p class="text-2xl font-bold ${textColor}">${prediction}</p>
                        <div class="mt-3 w-full bg-gray-200 rounded-full h-6">
                            <div class="${confidenceBg} h-6 rounded-full flex items-center justify-center text-sm font-medium text-gray-900" style="width: ${confidence}">
                                ${confidence}
                            </div>
                        </div>
                        <p class="text-sm text-gray-500 mt-1">Confidence Score</p>
                    </div>
                </div>
            `;
        };

        detectBtn.addEventListener('click', async () => {
            const text = textInput.value;
            if (!text.trim()) {
                alert('Please enter some text to analyze.');
                return;
            }

            resultsSection.classList.remove('hidden');
            resultsGrid.innerHTML = '';
            loader.classList.remove('hidden');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                loader.classList.add('hidden');

                const lrCard = createResultCard('Logistic Regression', data.lr.prediction, data.lr.confidence);
                const xgbCard = createResultCard('XGBoost', data.xgb.prediction, data.xgb.confidence);
                const robertaCard = createResultCard('RoBERTa', data.roberta.prediction, data.roberta.confidence);
                
                resultsGrid.innerHTML = lrCard + xgbCard + robertaCard;

            } catch (error) {
                loader.classList.add('hidden');
                resultsGrid.innerHTML = `<p class="text-center text-red-600 col-span-3">An error occurred: ${error.message}. Please ensure the backend server is running.</p>`;
            }
        });
    </script>
</body>
</html>
